<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>

  <body>
    <a class="site-logo" href="#hero">Nour Tighza</a>
    <!-- permet de toujours accéder au contenu principal rapidement -->
    <a class="skip-link" href="#contenu">Aller au contenu principal</a>

    <header class="site-header">
      <a class="site-logo" href="#hero">Nour Tighza</a>

      <nav aria-label="Navigation principale">
        <a href="#projets">Projets</a>
        <a href="#apropos">À propos</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main id="contenu">
      <!-- hero avec l'expérience intéractive -->
      <section id="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Atelier</h1>
        <p>Les meilleurs de mes projets</p>
      </section>

      <section id="projets" aria-labelledby="projects-title">
        <h2 id="projects-title">Mes projets</h2>

        <!-- pour projects.json -->
        <div id="projects-list" class="projects-list">
          <p>Chargement des projets...</p>
        </div>
      </section>

      <section id="apropos" aria-labelledby="about-title">
        <h2 id="about-title">Créer avec curiosité</h2>
      </section>

      <section id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Je suis disponible.</h2>
        <a href="mailto:tighzanour@gmail.com">tighzanour@gmail.com</a>
      </section>
    </main>

    <!-- fenêtre réutilisée pour les détails de chaque projet -->
    <dialog id="project-dialog" class="project-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Fermer la fiche du projet">Fermer</button>

      <article id="dialog-content">
        <h2 id="dialog-title">Détails du projet</h2>
      </article>
    </dialog>

    <footer>
      <p>2026 Nour Tighza. Tous droits réservés.</p>
    </footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
